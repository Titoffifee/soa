services:
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: marketplace/user-service:dev
    container_name: marketplace-user-service
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
